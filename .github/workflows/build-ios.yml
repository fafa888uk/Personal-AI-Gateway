# Personal AI Gateway — Build iOS (unsigned IPA)
#
# 触发：版本标签 vX.Y.Z push、手动触发、Flutter 代码的 PR。
# GitHub 托管 macOS Runner；Flutter 固定 3.50.0（与本地 ~/flutter 一致）。
# flutter build ipa --no-codesign：禁用签名，不要求、不上传任何 Apple 证书。
# Runner.app 装入 Payload 目录后打包 .ipa，并检查 IPA 内部目录与二进制完整性。
# 产物上传 Actions Artifacts；打 tag 时同时上传 GitHub Release。
# Release 始终以 Draft 创建，绝不自动发布正式版；发布须人工确认。
#
# 版本号来源（见 docs/ARCHITECTURE.md §14 单点管理目标）：
#   - 打 tag（vX.Y.Z）时：tag 去掉 v 即版本号，优先。
#   - PR / 手动构建：apps/flutter/pubspec.yaml 的 version（当前 0.1.0，
#     去掉 +build 号）+ "-dev.<短 SHA>"，并在产物名与发布说明中明确标注
#     为开发构建。
#   - 版本已统一为 0.1.0（2026-11-14）：网关 apps/api/gateway/main.py
#     的 VERSION、pyproject、Flutter pubspec、Web package.json 均为
#     0.1.0；tag v0.1.0 为唯一版本源；/api/v1/app/version 返回的
#     gateway_version 即发版版本。
#
# 诚实标记：未经真机安装测试，产物一律标记“仅构建验证”
# （build-only），绝不把打包成功写成设备安装成功。用户自签安装。

name: Build iOS (unsigned IPA)

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: ["apps/flutter/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Resolve release version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must be vX.Y.Z, got: $GITHUB_REF"
              exit 1
            fi
            IS_RELEASE=true
          else
            BASE="$(python3 -c "import re; print(re.search(r'^version:\s*([0-9.]+)', open('apps/flutter/pubspec.yaml').read(), re.M).group(1))")"
            VERSION="${BASE}-dev.${GITHUB_SHA::7}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "## Version"
            echo ""
            echo "- Release version: \`$VERSION\`"
            echo "- From tag release: \`$IS_RELEASE\`"
            echo "- Source: git tag vX.Y.Z if tagged, else pubspec.yaml + \`-dev.<sha>\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    needs: resolve-version
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Set up Flutter 3.50.0 (pinned — matches local ~/flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Regenerate default Flutter scaffold assets
        # The 36 default icon/splash binaries are NOT stored in git
        # (snapshot pushes carry UTF-8 text only). Regenerate them
        # here so the build runs on a complete tree. Verified
        # locally: flutter create reproduces them byte-identical.
        working-directory: apps/flutter
        run: |
          flutter create --org ai.personal.gateway --project-name personal_ai_gateway --platforms android,ios,linux,macos,web,windows .
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -f macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
          test -f windows/runner/resources/app_icon.ico
      - name: Flutter pub get
        working-directory: apps/flutter
        run: flutter pub get
      - name: Build IPA without code signing
        working-directory: apps/flutter
        run: |
          flutter build ipa --release --no-codesign \
            --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
      - name: Package Runner.app into Payload/*.ipa
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          # flutter build ipa --no-codesign skips the IPA export and only
           # produces an xcarchive (Flutter 3.50 build_ios.dart: with
           # --no-codesign it returns right after the archive step), so the
           # .app lives inside the xcarchive, not build/ios/iphoneos/.
           APP="$(find build/ios/archive/Runner.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -n 1)"
           if [ -z "$APP" ]; then
             APP="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          fi
          if [ -z "$APP" ]; then
            echo "::error::No .app found under build/ios/archive or build/ios/iphoneos"
            ls -R build/ios | head -n 50
            exit 1
          fi
          echo "Found app: $APP"
          rm -rf Payload "PersonalAI-${VERSION}-ios-unsigned.ipa"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r -q "PersonalAI-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -la "PersonalAI-${VERSION}-ios-unsigned.ipa"
      - name: Verify IPA contents and binary integrity
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          IPA="PersonalAI-${VERSION}-ios-unsigned.ipa"
          test -s "$IPA"
          unzip -l "$IPA" | grep -E 'Payload/Runner\.app/(Runner|Info\.plist)$'
          rm -rf /tmp/pag-ipa-check
          mkdir -p /tmp/pag-ipa-check
          unzip -q "$IPA" -d /tmp/pag-ipa-check
          test -x /tmp/pag-ipa-check/Payload/Runner.app/Runner
          test -s /tmp/pag-ipa-check/Payload/Runner.app/Runner
          file /tmp/pag-ipa-check/Payload/Runner.app/Runner
          python3 - <<'EOF'
          import plistlib
          with open("/tmp/pag-ipa-check/Payload/Runner.app/Info.plist", "rb") as f:
              info = plistlib.load(f)
          print("CFBundleShortVersionString:", info.get("CFBundleShortVersionString"))
          print("CFBundleExecutable:", info.get("CFBundleExecutable"))
          assert info.get("CFBundleExecutable") == "Runner"
          EOF
          echo "IPA integrity check passed."
      - name: SHA-256 checksums
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          IPA="PersonalAI-${VERSION}-ios-unsigned.ipa"
          sha256sum "$IPA" > checksums.txt
          cat checksums.txt
          {
            echo "## iOS build — $VERSION"
            echo ""
            echo "- Artifact: \`$IPA\` (unsigned, no code signing)"
            echo "- SHA-256: \`$(cut -d' ' -f1 checksums.txt)\`"
            echo "- Status: **build-only — 仅构建验证，未在真机安装测试**"
            echo "- Install: user self-signs the IPA with their own method;"
            echo "  this CI never signs and never uploads Apple certificates."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          # "build-only" is part of the artifact name on purpose: an
          # untested build must never be mistaken for an install-tested one.
          name: personal-ai-${{ needs.resolve-version.outputs.version }}-ios-unsigned-build-only
          path: |
            apps/flutter/PersonalAI-${{ needs.resolve-version.outputs.version }}-ios-unsigned.ipa
            apps/flutter/checksums.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: Upload IPA to GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    # Only real tag builds publish a Release. PR / manual dev builds stop
    # at the artifact above.
    if: needs.resolve-version.outputs.is_release == 'true'
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: personal-ai-${{ needs.resolve-version.outputs.version }}-ios-unsigned-build-only
          path: release-assets
      - name: Upload to GitHub Release
        run: |
          set -euo pipefail
          cd release-assets
          TAG="${GITHUB_REF#refs/tags/}"
          SHA="$(cut -d' ' -f1 checksums.txt)"
          cat > NOTES.md <<EOF
          # Personal AI Gateway $VERSION — iOS

          **仅构建验证 (build-only)：** 此 IPA 仅在 GitHub Actions 上编译打包成功，
          未在真机上安装、启动测试过。打包成功不等于设备安装成功。

          - 未签名 IPA：\`PersonalAI-$VERSION-ios-unsigned.ipa\`
          - SHA-256：\`$SHA\`
          - 安装方式：用户自行签名后安装；CI 不提供签名证书或 Apple 账号。
          - 更新信息以服务端 \`GET /api/v1/app/version\` 为准，须与本 Release 版本一致。
          EOF
          # Draft on purpose: a tag build must never auto-publish a
          # formal release; publishing is a deliberate manual step.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Personal AI Gateway $VERSION" --notes-file NOTES.md
          fi
          gh release upload "$TAG" "PersonalAI-$VERSION-ios-unsigned.ipa" checksums.txt --clobber
