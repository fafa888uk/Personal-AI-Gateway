# Personal AI Gateway — CI
#
# 代码检查、Flutter analyze/test、后端 pytest、Web 构建、依赖安全检查。
# 触发：PR（全部）与 main / develop 的 push。
# 任一 job 失败 => 整个 workflow 失败；汇总 job 如实报告各 job 状态，
# 绝不输出“全部成功”除非全部真的通过。
# 本 workflow 只做检查与构建验证，不发版、不部署（发版见 build-*.yml，
# 部署见 deploy-server.yml）。

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install "pytest>=8" "pytest-asyncio>=0.24"
      - name: Run pytest (mock upstream only — no real OpenAI key)
        run: python -m pytest tests/ -q

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.50.0 (pinned — matches local ~/flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Regenerate default Flutter scaffold assets
        # The 36 default icon/splash binaries are NOT stored in git
        # (snapshot pushes carry UTF-8 text only). Regenerate them
        # here so analyze/test run on a complete tree. Verified
        # locally: flutter create reproduces them byte-identical.
        working-directory: apps/flutter
        run: |
          flutter create --org ai.personal.gateway --project-name personal_ai_gateway --platforms android,ios,linux,macos,web,windows .
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -f macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
          test -f windows/runner/resources/app_icon.ico
      - name: Flutter pub get
        working-directory: apps/flutter
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: Flutter test
        working-directory: apps/flutter
        run: flutter test

  web:
    name: Web typecheck + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 (not 20): vitest 4.0.8 + Node 20 hangs on the jsdom
      # component tests (Vite servers never close; reproduced locally —
      # Node 20.19 full suite hangs, Node 24.22 passes in ~9s).
      # Local dev runs Node 24.22.1; keep CI on the same major.
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Test
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (project dependencies only)
        # Scoped to apps/api/requirements.txt on purpose: the installed
        # pip itself (24.0) carries 12 known vulnerabilities (see
        # docs/STATUS.md gap 18); auditing the whole environment would
        # fail CI on pip itself, not on project code. Project deps are
        # currently clean; a finding here fails the job.
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r apps/api/requirements.txt --strict
      - name: npm audit
        # Known limitation (docs/STATUS.md gap 17): this registry returns
        # 403 policy_denied, so npm audit cannot run here. This step is
        # continue-on-error and its outcome is reported honestly in the
        # summary job — a pass here must never be read as "npm deps clean".
        id: npm-audit
        continue-on-error: true
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: No .env tracked in git
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git — secrets must never be committed."
            exit 1
          fi
          echo "No .env file is tracked."

  summary:
    name: CI summary (honest roll-up)
    runs-on: ubuntu-latest
    needs: [backend, flutter, web, security]
    if: always()
    steps:
      - name: Report per-job results
        run: |
          {
            echo "## CI summary — ${{ github.sha }}"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Backend pytest | ${{ needs.backend.result }} |"
            echo "| Flutter analyze + test | ${{ needs.flutter.result }} |"
            echo "| Web typecheck + lint + test + build | ${{ needs.web.result }} |"
            echo "| Dependency security audit | ${{ needs.security.result }} |"
            echo ""
            echo "npm audit: the registry returns 403 here (known gap), so an"
            echo "npm-audit pass in CI must not be read as \"npm deps clean\"."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.flutter.result }}" != "success" ] \
            || [ "${{ needs.web.result }}" != "success" ] \
            || [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::CI failed — see the per-job results above. No release or deploy may proceed."
            exit 1
          fi
          echo "All CI jobs passed." >> "$GITHUB_STEP_SUMMARY"
